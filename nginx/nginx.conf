events {
    worker_connections 1024;
}

http {
    # Never reveal the nginx version in Server headers or error pages.
    server_tokens off;

    # Redirect all plain HTTP to HTTPS.
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        # Replace _ with your domain name in production (e.g. proxy.example.com).
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # TLS 1.2+ with a modern cipher suite.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Prevent the response from being framed or MIME-sniffed.
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;

        # Strip headers that reveal backend implementation details.
        proxy_hide_header X-Powered-By;
        proxy_hide_header x-CacheProxyfy-Ecosystem;

        # Package tarballs can be large.
        client_max_body_size 512m;

        location / {
            proxy_pass http://proxy:8080;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # First fetch from an upstream registry can be slow.
            proxy_connect_timeout 10s;
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
        }
    }
}
