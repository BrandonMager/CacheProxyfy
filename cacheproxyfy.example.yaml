proxy:
  port: 8080
  ecosystems:
    - npm
    - pypi 
    - maven 

cache:
  backend: local       # "local" or "s3"
  local_dir: ./data/artifacts
  ttl_hours: 720
  eviction_interval_hours: 1

s3:
  bucket: ""           # required when backend=s3
  region: us-east-1
  endpoint: ""         # optional: override for MinIO / LocalStack
  key_prefix: ""       # optional: e.g. "artifacts"
  access_key_id: ""    # optional: falls back to env vars / IAM role
  secret_access_key: ""

redis:
  addr: localhost:6379
  password: ""
  db: 0

database:
  host: localhost
  port: 5432
  user: postgres
  password: ""
  dbname: postgres
  sslmode: disable

security:
  cve_scanning: true
  block_severity: CRITICAL
  warn_severity: HIGH

auth:
  enabled: false
  users:
    # Generate a bcrypt hash for a password with either of these commands:
    #   htpasswd -bnBC 12 "" yourpassword | tr -d ':\n'
    #   docker run --rm httpd:alpine htpasswd -bnBC 12 "" yourpassword | tr -d ':\n'
    # - username: alice
    #   password_hash: "$2y$12$..."

rate_limit:
  enabled: false          # set to true to throttle upstream registry fetches
  requests_per_second: 10 # token refill rate per ecosystem (sustained throughput)
  burst: 20               # max tokens that can accumulate (handles short bursts)
  # overrides: per-ecosystem limits that take precedence over the global defaults above.
  # Useful when registries have different rate limits (e.g. proxy.golang.org is stricter
  # than registry.npmjs.org). Must be configured via this YAML file — env vars cannot
  # express nested maps.
  # overrides:
  #   npm:
  #     requests_per_second: 50
  #     burst: 100
  #   maven:
  #     requests_per_second: 5
  #     burst: 10
