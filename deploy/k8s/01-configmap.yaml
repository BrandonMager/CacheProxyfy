apiVersion: v1
kind: ConfigMap
metadata:
  name: cacheproxyfy-config
  namespace: cacheproxyfy
data:
  # Full application config mounted at /etc/cacheproxyfy/cacheproxyfy.yaml.
  # Passwords and credentials are intentionally absent — they are injected at
  # runtime from the cacheproxyfy-secret Secret as env vars, which viper picks
  # up automatically via AutomaticEnv and overrides these empty defaults.
  cacheproxyfy.yaml: |
    proxy:
      port: 8080
      ecosystems:
        - npm
        - pypi
        - maven

    cache:
      backend: local       # "local" or "s3"
      local_dir: /app/data/artifacts
      ttl_hours: 720
      eviction_interval_hours: 1

    s3:
      bucket: ""           # required when backend=s3
      region: us-east-1
      endpoint: ""         # optional: override for MinIO / LocalStack
      key_prefix: ""       # optional: e.g. "artifacts"
      access_key_id: ""    # optional: overridden by CACHEPROXYFY_S3_ACCESS_KEY_ID or IAM role
      secret_access_key: "" # optional: overridden by CACHEPROXYFY_S3_SECRET_ACCESS_KEY or IAM role

    redis:
      addr: redis:6379
      db: 0
      password: ""   # overridden by CACHEPROXYFY_REDIS_PASSWORD secret

    database:
      host: postgres
      port: 5432
      user: cacheproxyfy
      dbname: cacheproxyfy
      sslmode: disable
      password: ""   # overridden by CACHEPROXYFY_DATABASE_PASSWORD secret

    security:
      cve_scanning: true
      block_severity: CRITICAL
      warn_severity: HIGH

    auth:
      enabled: false
      users:
        # Generate a bcrypt hash for a password with either of these commands:
        #   htpasswd -bnBC 12 "" yourpassword | tr -d ':\n'
        #   docker run --rm httpd:alpine htpasswd -bnBC 12 "" yourpassword | tr -d ':\n'
        # - username: alice
        #   password_hash: "$2y$12$..."

    log:
      level: info
      format: json

    rate_limit:
      enabled: false
      requests_per_second: 10
      burst: 20
      # overrides:
      #   npm:
      #     requests_per_second: 50
      #     burst: 100
      #   maven:
      #     requests_per_second: 5
      #     burst: 10
